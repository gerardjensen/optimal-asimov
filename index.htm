<html>
  <head>
    
    <style>
      .novel {
         background-color: #AAA;
      }

      .short-fiction {
        border-radius: 5px;
        background-color: #CCC;  
      }

      .card {
        width: 20px;
        height: 30px;
        flex-shrink: 0; 
        position: relative;
        display: inline-block;
      }

      .uncollected {
        width: 12px;
        height: 22px;
        border: 4px solid #800;
      }

      .separator {
        background-color: rgba(0,0,0,0.03);
        border: 1px solid #333;
        margin: 3px;
        padding: 10px;
        display: flex;
        flex-direction: column;    
        flex-grow: 1;               
      }

      .container {
        display: flex;
        flex-direction: row;        
        align-items: stretch;       
        justify-content: flex-start;
        gap: 10px;                  
        flex-grow: 1;
        flex-wrap: wrap;           
      }

      .card-container {
        display: flex;
        flex-wrap: wrap;            
        gap: 4px;
        align-content: flex-start;
        width: 100%;               
        margin-top: 5px;            
      }

      div > h3, div > p {
        margin-top: 5px;
        margin-bottom: 5px;
      }

      .tooltiptext {
        visibility: hidden;
        width: 130px;
        background-color: #555;
        color: #fff;
        text-align: center;
        border-radius: 3px;
        padding: 5px 3px;
        position: absolute;
        z-index: 1;
        right: -65px;
        /*margin-left: -65px;*/
        margin-bottom: 5px;
        bottom: 100%;
      }

      .card:hover .tooltiptext {
        visibility: visible;
      }

    </style>
  </head>
  <body>
    <h1>The Optimal Asimov</h1>
    <p>Collection Viewer</p>
    <div id="selector">
      <label for="pubs"></label>
      <select onchange="on_pub_select(this.selectedIndex, this.value);" name="pubs" id="pubs">
        <option selected value> -- no publication -- </option>
      </select>
    </div>
    <div id="content"></div>


    <script src="script.js"></script> 
  </body>
</html>
