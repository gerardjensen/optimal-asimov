<!DOCTYPE html>
<html lang="en">
  <head> 
    <style>
      #content {
        margin-right: 50px;
        margin-left: 50px;
      }
      .novel {
         background-color: #AAA;
      }

      .short-fiction {
        border-radius: 5px;
        background-color: #CCC;  
      }

      .card {
        width: 20px;
        height: 30px;
        flex-shrink: 0; 
        position: relative;
        color:white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 22px;
      }

      .uncollected {
        width: 12px;
        height: 22px;
        border: 4px solid #800;
      }

      .separator {
        background-color: rgba(0,0,0,0.03);
        border: 1px solid #333;
        margin: 3px;
        padding: 10px;
        display: flex;
        flex-direction: column;    
        flex-grow: 1;               
      }

      .container {
        display: flex;
        flex-direction: row;        
        align-items: stretch;       
        justify-content: flex-start;
        gap: 10px;                  
        flex-grow: 1;
        flex-wrap: wrap;           
      }

      .card-container {
        display: flex;
        flex-wrap: wrap;            
        gap: 4px;
        align-content: flex-start;
        width: 100%;               
        margin-top: 5px;            
      }

      div > h3, div > p {
        margin-top: 5px;
        margin-bottom: 5px;
      }

      .tooltiptext {
        visibility: hidden;
        width: 130px;
        background-color: #555;
        color: #fff;
        text-align: center;
        border-radius: 3px;
        padding: 5px 3px;
        position: absolute;
        z-index: 1;
        right: -65px;
        /*margin-left: -65px;*/
        margin-bottom: 5px;
        bottom: 100%;
      }

      .card:hover .tooltiptext {
        visibility: visible;
      }

      .pub-list {
        display: flex;
        flex-wrap: wrap;            
        gap: 4px;
        align-content: flex-start;
        margin-top: 5px;
      }

      .pub-list > p {
        margin: 5px;
      }

      .pub-item > p > a, .card-container > a { 
        color: inherit !important;
        text-decoration: none !important;
      }

      .pub-item {
        border: 1px solid #000;
        padding-left: 3px;
        padding-right: 10px;
        border-radius: 10px;
        display: flex;
        gap: 2px;
      }

      .pub-item > p:hover {
        text-decoration: underline;
      }

      .close {
        cursor: pointer;
        padding: 4px 4px;
        margin-left: 5px;
        margin-right: 3px;

      }

      .close:hover {
        background: #bbb;
      }
    </style>
  </head>
  <body>
    <h1>The Optimal Asimov</h1>
    <h2>Collection Viewer</h2>
    <div id="selector" style="margin-bottom: 10px">
      <label for="pubs"></label>
      <select onchange="on_pub_select(this.selectedIndex, this.value);" name="pubs" id="pubs">
        <option selected value> -- no publication -- </option>
      </select>
      <button style="position: relative; left: 7px;" onclick="add_pub_viewer()"> Add</button>
      <div id="selected-pubs" class="pub-list">
      </div>
    </div>
    <div id="content"></div>
    <h2>Short Fiction Optimizer</h2>
    <div id="optimizer" class="container">
      <div>
        <p><strong>Already owned:</strong></p> 
        <select multiple size="10" id="I-pubs"></select>
      </div>
      <div>
        <p><strong>Unavailable to buy:</strong></p>
        <select multiple size="10" id="U-pubs"></select>
      </div>
      <div>
        <p><strong>Objective:</strong></p> 
        <input type="radio" id="ch-robots" name="objective" value="robots" checked="checked">
        <label for="ch-robots">The Positronic Robot Stories</label><br>
        <input type="radio" id="ch-foundation" name="objective" value="foundation">
        <label for="ch-foundation">Foundation Universe</label><br>  
        <input type="radio" id="ch-all" name="objective" value="all">
        <label for="ch-all">All Science Fiction</label><br><br>
      </div>
    </div>
    <button style="margin-top: 5px" onclick="optimize()"> Optimize! </button>
    

    <script src="./main.js"></script>
    <script src="script.js"></script> 
  </body>
</html>
