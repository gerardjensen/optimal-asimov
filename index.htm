<html>
  <head>
    
    <style>
      .card {
        width: 20px;
        height: 30px;
        border-radius: 5px;
        background-color: #CCC;
        flex-shrink: 0; 
      }

      .separator {
        background-color: rgba(0,0,0,0.03);
        border: 1px solid #333;
        margin: 3px;
        padding: 10px;
        display: flex;
        flex-direction: column;    
        flex-grow: 1;               
      }

      .container {
        display: flex;
        flex-direction: row;        
        align-items: stretch;       
        justify-content: flex-start;
        gap: 10px;                  
        flex-grow: 1;
        flex-wrap: wrap;           
      }

      .card-container {
        display: flex;
        flex-wrap: wrap;            
        gap: 4px;
        align-content: flex-start;
        width: 100%;               
        margin-top: 5px;            
      }

      div > h3, div > p {
        margin-top: 5px;
        margin-bottom: 5px;
      }

    </style>
  </head>
  <body>
    <h1>The Optimal Asimov</h1>
    <p>WIP</p>
    <div id="content"></div>

    <script src="script.js"></script> 
  </body>
</html>
